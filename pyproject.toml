[project]
name = "sie-atlas-ops"
version = "0.1.0"
description = "Command-line tool for SIE Atlas operations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "yaoxing" }]
dependencies = [
    "httpx>=0.28.1",
    "pyatlassdk",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
sie-atlas-ops = "sie_atlas_ops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sie_atlas_ops"]

[tool.uv.sources]
# Local checkout of the Atlas administration SDK; swap for a version pin once it is published.
pyatlassdk = { path = "../mongo-atlas-sdk/pyatlassdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sie_atlas_ops"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
